<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natural Juice Point - app design</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#e9ece6;--ink:#1d2a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#121512;--ink:#e8ede6;color-scheme:dark}}
:root[data-theme="dark"]{--page:#121512;--ink:#e8ede6;color-scheme:dark}
*{box-sizing:border-box;margin:0;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--page);color:var(--ink);min-height:100%;display:flex;justify-content:center;align-items:center;padding:16px}
.phone{--bg:#fff;--card:#fff;--soft:#f3f6ef;--text:#1d2a1f;--mute:#667064;--line:#e4e9de;--g:#2f7d3a;--gd:#1f5a29;--o:#f08a24;--r:#c8283a;
width:100%;max-width:390px;height:780px;max-height:calc(100vh - 32px);background:var(--bg);color:var(--text);border-radius:28px;overflow:hidden;position:relative;border:1px solid var(--line)}
@media (max-width:430px){body{padding:0}.phone{max-height:none;height:100vh;height:100dvh;border-radius:0;border:0}}
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.scr.on{display:flex}
.top{padding:14px 16px 8px}
button{border:0;background:none;cursor:pointer;color:inherit;font-size:14px}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.splash{background:#b3202f;cursor:pointer}
.splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.splash p{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,30,22,.72);color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;white-space:nowrap}
.hd{text-align:center;padding:26px 16px 8px}
.hd h1{font-size:20px;font-weight:600;margin-top:8px}
.hd p{font-size:13px;color:var(--mute)}
.list{padding:8px 16px;overflow:auto;flex:1}
.out{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.out.sel{border:2px solid var(--g)}
.out b{font-size:14px;font-weight:600;display:block}
.out small{display:block;color:var(--mute);font-size:12px;margin:2px 0 8px}
.tg{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;margin-right:4px;font-weight:500}
.t1{background:#e3f0fb;color:#17508a}.t2{background:#fdebd5;color:#8a4a0b}.t3{background:#e0f2e2;color:#1f5a29}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:10px 16px 0;width:calc(100% - 32px)}
.row.sel{border-color:var(--g);background:var(--soft)}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--o)}
.row b{font-weight:600;font-size:15px;display:block}.row small{color:var(--mute);font-size:12px}
.chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:13px}
.row.sel .chk{background:var(--g);border-color:var(--g)}
.cta{margin:auto 16px 16px;background:var(--g);color:#fff;border-radius:14px;padding:14px;font-weight:600;font-size:15px;width:calc(100% - 32px)}
.cta:active{background:var(--gd)}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 14px}
.hbar .ttl{flex:1;min-width:0}.ttl b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{font-size:11px;color:var(--mute)}
.ib{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px}
.body{overflow:auto;flex:1;padding-bottom:12px}
.ban{margin:0 14px;border-radius:18px;height:128px;position:relative;overflow:hidden;color:#fff}
.sl{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transition:opacity .5s}
.sl.on{opacity:1}.sl b{font-size:20px;font-weight:600;line-height:1.2}.sl span{font-size:12px;opacity:.9}
.sl i{position:absolute;right:12px;top:6px;font-size:64px;font-style:normal}
.seg{display:flex;margin:12px 14px;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--g);color:#fff}
h2{font-size:16px;font-weight:600;padding:6px 14px}
.hs{display:flex;gap:10px;overflow:auto;padding:0 14px 6px}
.pc{flex:0 0 150px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.pc .im{height:84px;display:grid;place-items:center;font-size:42px;position:relative}
.pc .bd{padding:8px 10px}.pc b{font-size:13px;font-weight:600;display:block}.pc small{font-size:11px;color:var(--mute)}
.off{position:absolute;left:8px;top:8px;background:var(--r);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:500}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:13px;font-weight:600}
.pr s{color:var(--mute);font-weight:400;font-size:11px;margin-left:4px}
.pl{width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;font-size:16px;line-height:1}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 14px}
.chips button{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid var(--line);font-size:13px}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.it{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.it .tx{flex:1;min-width:0}.it b{font-size:14px;font-weight:600;display:block}.it small{font-size:12px;color:var(--mute);display:block;margin:2px 0 4px}
.it .im{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;font-size:36px;flex-shrink:0}
.add{border:1.5px solid var(--g);color:var(--g);border-radius:10px;padding:5px 14px;font-weight:600;font-size:13px}
.srch{margin:0 14px 4px;display:block;width:calc(100% - 28px);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:14px;color:var(--text)}
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
.nav button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--mute);position:relative}
.nav button.on{color:var(--g);font-weight:600}.nav i{display:block;font-style:normal;font-size:20px}
.bdg{position:absolute;top:4px;left:56%;background:var(--r);color:#fff;border-radius:9px;font-size:10px;min-width:16px;padding:1px 4px}
.cbar{margin:6px 14px 14px;background:var(--g);color:#fff;border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;font-weight:600;font-size:14px;width:calc(100% - 28px)}
.cbar[hidden]{display:none}
.frm{padding:10px 16px 0}.frm label{font-size:12px;color:var(--mute);display:block;margin:6px 0 3px}.frm input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--soft);color:var(--text)}.err{color:var(--r);font-size:12px;padding:6px 16px 0;min-height:18px}
.wa{background:#128c7e}
.wafab{position:absolute;right:16px;bottom:20px;width:60px;height:60px;border-radius:50%;display:block;z-index:4;background:#fff}
.wafab svg{width:60px;height:60px;display:block}
.cbar:not([hidden])~.wafab{bottom:84px}
.fab{position:absolute;right:14px;bottom:20px;width:64px;height:64px;z-index:4;transition:bottom .2s;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.fab img{width:100%;height:100%;display:block}
.fab:focus-visible{outline:3px solid var(--gd);outline-offset:3px}

.im{background-size:cover;background-position:center;background-repeat:no-repeat}
.dr{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:5}
.dr.on{display:block}
.dp{width:82%;height:100%;background:var(--gd);color:#fff;padding:20px 16px;overflow:auto}
.dp .wl{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dp .av{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px}
.dp small{opacity:.8;font-size:12px}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.1);text-align:left;color:#fff}
.mi em{font-style:normal;font-size:17px}.mi span{flex:1}
.ci{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ci .im{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px}
.ci .tx{flex:1}.ci b{font-size:14px;font-weight:600;display:block}.ci small{font-size:12px;color:var(--mute)}
.q{display:flex;align-items:center;gap:8px}.q button{width:26px;height:26px;border-radius:50%;background:var(--soft);font-weight:600}
.sum{padding:12px 16px;font-size:14px}.sum div{display:flex;justify-content:space-between;margin-bottom:6px}.sum .tt{font-weight:600;font-size:16px}
.empty{text-align:center;color:var(--mute);padding:40px 20px;font-size:14px}
.ok{align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px}
.ok .big{width:72px;height:72px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:36px}
</style>

<script>
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function logo(n){var L='',i,a,x,y;for(i=0;i<30;i++){a=i*12;L+='<ellipse cx="100" cy="12" rx="4" ry="9" fill="'+(i%3?'#3f9a4b':'#2f7d3a')+'" transform="rotate('+a+' 100 100) rotate('+(i%2?25:-25)+' 100 12)"/>'}

return '<svg width="'+n+'" height="'+n+'" viewBox="0 0 200 200" role="img" aria-label="Natural Juice Point logo"><circle cx="100" cy="100" r="96" fill="#fff"/><circle cx="100" cy="100" r="74" fill="#2c3a2e"/>'+L+'<text x="100" y="76" text-anchor="middle" font-size="12" letter-spacing="2" fill="#fff">NATURAL</text><text x="100" y="102" text-anchor="middle" font-size="27" font-weight="600" fill="#fff">JUICE</text><text x="100" y="116" text-anchor="middle" font-size="10" letter-spacing="2" fill="#fff">POINT</text>'+g(84,'#f4a06a','#f28b3a')+g(100,'#e6e58a','#f5c542')+g(116,'#7a1f2b','#f08a24')+'<text x="100" y="172" text-anchor="middle" font-size="8" fill="#fff">0301-1354956</text></svg>'}
$$('.logo').forEach(function(e){e.innerHTML=logo(+e.dataset.size)});

var OUT=[['Outlet 1 - Main branch','Shop address line 1, your area, city'],['Outlet 2 - Second branch','Shop address line 2, your area, city'],['Outlet 3 - Third branch','Shop address line 3, your area, city']];
var ITEMS=[

['Pineapple juice','Sweet and tangy, no added sugar.',260,'Fresh juices','',1,1],
['Kinnow juice','Fresh kinnow served over ice.',230,'Fresh juices','',2],
['Carrot juice','Fresh carrots, smooth and light.',200,'Fresh juices','',3],
['Orange juice','Freshly squeezed oranges.',220,'Fresh juices','',4,1],

function show(id){$$('.scr').forEach(function(s){s.classList.toggle('on',s.id==='s-'+id)})}
function money(n){return 'Rs. '+n.toLocaleString('en-US')}

setTimeout(function(){if($('#s-splash').classList.contains('on'))show('home')},2500);

$$('#seg button').forEach(function(b){b.onclick=function(){type=b.textContent;setSeg()}});

function badge(){var n=0,t=0;for(var k in cart){n+=cart[k];t+=ITEMS[k][2]*cart[k]}$('#cbar').hidden=!n;$('#fab').style.bottom=n?'80px':'20px';$('#cn').textContent=n+(n===1?' item - ':' items - ')+money(t)}
$('#cbar').onclick=function(){drawCart();show('cart')};

var M=[['&#128205;',function(){return outl}],['&#128220;','My orders'],['&#128260;','Reorder'],['&#127991;','Offers'],['&#9825;','Favorites'],['&#127873;','Rewards and loyalty'],['&#11088;','Reviews'],['&#128746;','Delivery areas'],['&#128339;','Opening hours'],['&#127911;','Support']];
$('#dp').innerHTML='<div class="wl"><div class="av">&#128100;</div><div><b>Welcome</b><br><small>Log in to place your order</small></div></div>'+M.map(function(m){return '<button class="mi"><em>'+m[0]+'</em><span>'+(typeof m[1]==='function'?m[1]():m[1])+'</span>&#8250;</button>'}).join('')+'<p style="text-align:center;margin-top:16px"><small>Natural Juice Point - 0301-1354956<br>Version 1.0.0</small></p>';
$('#openDr').onclick=function(){$('#dr').classList.add('on')};
$('#dr').onclick=function(e){if(e.target.id==='dr')$('#dr').classList.remove('on')};

function drawCart(){var ks=Object.keys(cart),t=0;$('#ctype').textContent=type+' - '+outl;$('#adw').style.display=type==='Delivery'?'block':'none';
$('#cbody').innerHTML=ks.length?ks.map(function(k){var it=ITEMS[k];t+=it[2]*cart[k];return '<div class="ci"><div class="im" style="background-image:var(--img'+it[5]+')"></div><div class="tx"><b>'+it[0]+'</b><small>'+money(it[2])+'</small></div><div class="q"><button data-q="-'+k+'" aria-label="Less">-</button><span>'+cart[k]+'</span><button data-q="+'+k+'" aria-label="More">+</button></div></div>'}).join(''):'<p class="empty">Your cart is empty. Add a juice to start your order.</p>';
var d=type==='Delivery'&&t?100:0;$('#sum').innerHTML='<div><span>Subtotal</span><span>'+money(t)+'</span></div><div><span>Delivery fee</span><span>'+money(d)+'</span></div><div class="tt"><span>Total</span><span>'+money(t+d)+'</span></div>'}
$('#cbody').onclick=function(e){var b=e.target.closest('[data-q]');if(!b)return;var k=b.dataset.q.slice(1);cart[k]+=b.dataset.q[0]==='+'?1:-1;if(cart[k]<1)delete cart[k];badge();drawCart()};
$('#back').onclick=function(){show('home')};
var WA='923011354956';
$('#fab').href='https://wa.me/'+WA+'?text='+encodeURIComponent('Hello Natural Juice Point, I want to place an order.');
$('#place').onclick=function(){var ks=Object.keys(cart),e=$('#err');if(!ks.length){e.textContent='Add at least one juice before you order.';return}
var nm=$('#nm').value.trim(),ad=$('#ad').value.trim();if(!nm){e.textContent='Enter your name.';return}if(type==='Delivery'&&!ad){e.textContent='Enter your delivery address.';return}e.textContent='';
var t=0,L=ks.map(function(k){var it=ITEMS[k];t+=it[2]*cart[k];return cart[k]+' x '+it[0]+' - '+money(it[2]*cart[k])}),d=type==='Delivery'?100:0;
var m='*New order - Natural Juice Point*\nOutlet: '+outl+'\nType: '+type+'\nName: '+nm+(type==='Delivery'?'\nAddress: '+ad:'')+'\n\n'+L.join('\n')+'\n\nSubtotal: '+money(t)+(d?'\nDelivery fee: '+money(d):'')+'\n*Total: '+money(t+d)+'*'+($('#nt').value.trim()?'\nNote: '+$('#nt').value.trim():'');
var a=document.createElement('a');a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(m);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
cart={};badge();show('ok')};
$('#again').onclick=function(){show('home')};
</script>
</body>
